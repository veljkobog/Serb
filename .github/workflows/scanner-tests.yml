name: scanner tests

on:
  push:
    paths:
      - "scanner/**"
      - ".github/workflows/scanner-tests.yml"
  pull_request:
    paths:
      - "scanner/**"
      - ".github/workflows/scanner-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The scoring engine and its tests are stdlib-only, so no install step.
      - name: Run tests
        working-directory: scanner
        run: python -m unittest discover -s tests -v
